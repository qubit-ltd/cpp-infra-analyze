name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Check dependency baseline
        run: ./.infra/bin/dependency-update.sh --check

  # The shared workflow has no setup hook before tests. Keep the standard
  # rs-infra commands and prepare the required native tools on this runner.
  rust-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      deploy: ${{ steps.pages-config.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - name: Install native C++ test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build clang-18 clang-tidy-18 libclang-18-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: rust-src, rustfmt, clippy, llvm-tools-preview
      - name: Install infrastructure formatting toolchain
        run: rustup toolchain install nightly-2026-06-05 --profile minimal --component rustfmt --component clippy
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Run complete crate CI
        run: ./.infra/bin/ci-check.sh
      - name: Validate Pages configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pages-config
        run: |
          set -euo pipefail
          jq -e '.deploy | type == "boolean"' .infra/pages/pages.json >/dev/null
          echo "deploy=$(jq -r .deploy .infra/pages/pages.json)" >> "$GITHUB_OUTPUT"
      - name: Build Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./.infra/bin/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/pages" build
      - name: Prepare Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./.infra/bin/infra-tool.sh rs-infra-pages --project "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/pages" --artifact "$RUNNER_TEMP/pages-artifact.tar.gz" artifact
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/pages

  pages-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.rust-ci.outputs.deploy == 'true'
    needs: [dependency-baseline, rust-ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
