[package]
name = "qubit-cpp-infra-analyze"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Governed clang-tidy analysis for C++ projects"
repository = "https://github.com/qubit-ltd/cpp-infra-analyze"
include = ["src/**", "build.rs", "conf/**", "assets/**", "schemas/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "README.zh_CN.md", "rust-toolchain.toml"]
authors = ["Haixing Hu"]

[lib]
name = "cpp_infra_analyze"

[[bin]]
name = "cpp-infra-analyze"
path = "src/main.rs"

[dependencies]
clap = { version = "^4.5", features = ["derive"] }
fs2 = "^0.4"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_yaml = { package = "serde_norway", version = "^0.9" }
sha2 = "^0.11"
thiserror = "^2.0"
toml = "^0.9"
libc = "^0.2"
ctrlc = "^3.0"
shell-words = "^1.0"
time = { version = "^0.3", features = ["formatting"] }
libloading = "^0.8"

[dev-dependencies]
tempfile = "^3.27"
